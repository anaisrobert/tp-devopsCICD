name: Deploy to Docker Hub

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v3

      - name: Créer le fichier .env avec les secrets
        run: |
          echo "DOCKER_USER=${{ secrets.DOCKER_USERNAME }}" > .env
          echo "C_EST_UN_SECRET=Vrai" >> .env

      - name: Se connecter à Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Construire les images Docker
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/mon-frontend:latest ./frontend
          docker build -t ${{ secrets.DOCKER_USERNAME }}/mon-backend:latest ./backend

      - name: Envoyer (Push) les images sur Docker Hub
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/mon-frontend:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/mon-backend:latest
